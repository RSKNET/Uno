name: History Sweeper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4

      - name: Checkout Private Actions Repo
        uses: actions/checkout@v4
        with:
          repository: RSKNET/Github-Actions
          token: ${{ secrets.GH_PAT }}
          path: .github/actions/github-actions

      - name: Run History Sweeper Action
        uses: ./.github/actions/github-actions/History Sweeper
        with:
          retain_days: 5
          keep_minimum_runs: 3
          github_token: ${{ secrets.GITHUB_TOKEN }}
