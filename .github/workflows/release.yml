name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Auto Bump & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          
          COMMITS=$(git log $LAST_TAG..HEAD --oneline)
          echo "Commits:"
          echo "$COMMITS"
          
          BUMP="patch"
          if echo "$COMMITS" | grep -qE "feat\([a-zA-Z0-9_-]+\)!:|fix\([a-zA-Z0-9_-]+\)!:|feat!:|fix!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat|^feat\("; then
            BUMP="minor"
          fi
          echo "Bump type: $BUMP"
          
          npm version $BUMP --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: v$NEW_VERSION"
          
          if [ -f public/manifest.json ]; then
            node -e "
              const fs = require('fs');
              const manifest = JSON.parse(fs.readFileSync('public/manifest.json'));
              manifest.version = '$NEW_VERSION';
              fs.writeFileSync('public/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            "
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: release v$NEW_VERSION [skip ci]" || exit 0
          git push origin main
          
          gh release create "v$NEW_VERSION" --generate-notes