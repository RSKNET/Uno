name: History Sweeper

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  call-shared-cleanup:
    uses: RSKNET/Github-Actions/.github/workflows/history-sweeper.yml@main
    with:
      retain_days: 5
      keep_minimum_runs: 3
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}